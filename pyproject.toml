[project]
name = "quiver"
version = "0.1.0"
description = "A job-search harness agent built on the Claude Agent SDK."
readme = "README.md"
authors = [
    { name = "Frad LEE", email = "fradser@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.82",
    "typer>=0.25.1",
]

[project.scripts]
quiver = "quiver.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-bdd>=8.1.0",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*", "pytest_bdd.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
